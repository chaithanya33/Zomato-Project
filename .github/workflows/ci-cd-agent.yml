# Example workflow showing how a downstream repo uses the agent.
# Copy this into your own repo as `.github/workflows/ci-cd-agent.yml`.
name: CI/CD Agent

on:
  workflow_run:
    workflows: ["CI", "Build", "Test"]   # <-- list the workflows you want monitored
    types: [completed]

permissions:
  contents: write          # needed to push a branch with the proposed fix
  pull-requests: write     # needed to open the PR
  actions: read            # needed to download logs of the failing run

jobs:
  analyze-failure:
    # Only trigger when the watched workflow actually failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run CI/CD Pipeline Agent
        uses: your-org/ci-cd-agent@v1   # <-- replace once you publish the action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: all
          workflow-run-id: ${{ github.event.workflow_run.id }}
          max-cost-usd: '0.50'
          auto-create-pr: 'true'
          fix-confidence-threshold: '0.75'

  # Optional: nightly hygiene pass over all workflows (security + efficiency)
  nightly-audit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    timeout-minutes: 5
    steps:
      - uses: your-org/ci-cd-agent@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: security
          max-cost-usd: '0.10'
